<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sagini AI — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg:#060b15;--surface:#0c1528;--surface2:#111e35;--border:#1a2d4a;
      --text:#e8edf5;--text2:#7a8ba8;--text3:#3a4d6a;
      --accent:#c8962e;--navy:#0d1f4e;--green:#1a9e6a;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Sora',sans-serif; min-height:100vh; }
    header { background:var(--navy); border-bottom:1px solid rgba(200,150,46,0.2); padding:0 32px; height:60px; display:flex; align-items:center; justify-content:space-between; }
    .logo { font-size:15px; font-weight:700; color:#fff; }
    .admin-badge { font-size:10px; font-weight:700; padding:3px 10px; border-radius:4px; background:rgba(200,150,46,0.15); color:var(--accent); border:1px solid rgba(200,150,46,0.3); letter-spacing:1px; text-transform:uppercase; }
    main { max-width:1200px; margin:0 auto; padding:32px 24px; }
    h1 { font-size:22px; font-weight:700; color:var(--text); margin-bottom:4px; }
    .sub { font-size:12px; color:var(--text3); margin-bottom:32px; }
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; }
    .stat-label { font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; font-weight:600; margin-bottom:8px; }
    .stat-val { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px; margin-bottom:20px; }
    .card-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { background:var(--navy); color:rgba(255,255,255,0.5); padding:9px 14px; text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:1px; font-weight:600; }
    td { padding:10px 14px; border-bottom:1px solid var(--border); color:var(--text2); font-family:'JetBrains Mono',monospace; font-size:11px; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:var(--surface2); }
    .online { width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block; margin-right:6px; }
    .refresh-btn { padding:7px 16px; background:var(--navy); color:white; border:none; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; font-family:'Sora',sans-serif; }
    .logout-btn { padding:7px 16px; background:transparent; color:var(--text2); border:1px solid var(--border); border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; font-family:'Sora',sans-serif; }
    .error { padding:40px; text-align:center; color:#f87171; font-size:14px; }
  </style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:32px;height:32px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(200,150,46,0.3)">
      <span style="font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--accent)">S</span>
    </div>
    <span class="logo">Sagini AI Analytics</span>
    <span class="admin-badge">Admin</span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="refresh-btn" onclick="loadStats()">Refresh</button>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</header>

<main>
  <div id="error-screen" class="error" style="display:none">
    Access denied. Admin accounts only.<br><br>
    <a href="/app" style="color:var(--accent)">Go to App</a>
  </div>

  <div id="dashboard" style="display:none">
    <h1>Dashboard</h1>
    <p class="sub" id="last-updated"></p>

    <div class="stats-grid">
      <div class="stat">
        <div class="stat-label">Total Users</div>
        <div class="stat-val" id="s-total" style="color:var(--accent)">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">New Today</div>
        <div class="stat-val" id="s-today" style="color:#6366f1">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Active (7 days)</div>
        <div class="stat-val" id="s-active" style="color:var(--green)">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Uploads</div>
        <div class="stat-val" id="s-uploads" style="color:#d97706">—</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Signups — Last 14 Days</div>
      <div id="chart-signups" style="height:200px"></div>
    </div>

    <div class="card">
      <div class="card-title">Recent Users</div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Signed Up</th><th>Last Seen</th><th>Uploads</th></tr></thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  const API = window.location.origin;

  async function loadStats() {
    try {
      const res = await fetch(`${API}/api/admin/stats`, { credentials: 'include' });
      if (res.status === 403) {
        document.getElementById('error-screen').style.display = 'block';
        return;
      }
      if (!res.ok) throw new Error('Failed');
      const data = await res.json();
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('error-screen').style.display = 'none';

      document.getElementById('s-total').textContent = data.total_users;
      document.getElementById('s-today').textContent = data.new_today;
      document.getElementById('s-active').textContent = data.active_7d;
      document.getElementById('s-uploads').textContent = data.total_uploads;
      document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();

      // Chart
      const days = data.signups_by_day.reverse();
      Plotly.newPlot('chart-signups',
        [{ type:'bar', x: days.map(d=>d.day), y: days.map(d=>d.count), marker:{color:'#c8962e'} }],
        { margin:{t:10,b:40,l:40,r:10}, height:200, paper_bgcolor:'#0c1528', plot_bgcolor:'#0c1528',
          font:{color:'#7a8ba8',family:'Sora',size:11},
          xaxis:{gridcolor:'#1a2d4a'}, yaxis:{gridcolor:'#1a2d4a'} },
        { displayModeBar:false, responsive:true }
      );

      // Users table
      document.getElementById('users-table').innerHTML = data.recent_users.map(u => `
        <tr>
          <td style="color:var(--text);font-weight:600">${u.name}</td>
          <td>${u.email}</td>
          <td>${u.created_at ? u.created_at.slice(0,10) : '—'}</td>
          <td>${u.last_seen ? u.last_seen.slice(0,16).replace('T',' ') : 'Never'}</td>
          <td style="color:var(--accent)">${u.upload_count}</td>
        </tr>`).join('');
    } catch(e) {
      document.getElementById('error-screen').style.display = 'block';
    }
  }

  async function logout() {
    await fetch(`${API}/api/auth/logout`, { method:'POST', credentials:'include' });
    window.location.href = '/';
  }

  loadStats();
  setInterval(loadStats, 30000); // auto refresh every 30s
</script>
</body>
</html>
